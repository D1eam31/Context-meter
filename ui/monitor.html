<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Context Meter</title>
<style>
:root{color-scheme:light dark;font:14px/1.5 system-ui,sans-serif;background:var(--color-background-primary,Canvas);color:var(--color-text-primary,CanvasText);--line:#8884;--muted:light-dark(#62666c,#a4a9b0);--accent:light-dark(#176354,#73cfb5)}
*{box-sizing:border-box}body{margin:0;padding:18px;max-width:900px;margin-inline:auto}h1{font-size:21px;margin:0}h2{font-size:14px;margin:22px 0 8px}p{margin:6px 0}small,.muted{color:var(--muted)}header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}select,button{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}select{width:100%;margin:8px 0}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.toolbar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.session{overflow-wrap:anywhere;font:12px/1.5 ui-monospace,monospace;color:var(--muted)}#error{color:light-dark(#a52a2a,#ffa7a7)}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0}.card{padding:12px;border:1px solid var(--line);border-radius:10px}.card span{font-size:12px;color:var(--muted);display:block}.card strong{font:600 25px/1.5 system-ui;font-variant-numeric:tabular-nums}.card:first-child strong{color:var(--accent)}table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}th,td{padding:9px 3px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}th{font-weight:500;color:var(--muted)}footer{margin-top:20px;border-top:1px solid var(--line);padding-top:12px;font-size:12px;color:var(--muted)}progress{width:100%;height:7px;accent-color:var(--accent)}#detail{font-size:12px;color:var(--muted)}@media(max-width:390px){body{padding:12px}.cards{grid-template-columns:1fr}.card{display:flex;justify-content:space-between;align-items:center}.card strong{font-size:23px}table{font-size:12px}}

#session-picker{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:light-dark(#fff,#1d1f22);color:light-dark(#202328,#f0f2f5)}
#session-toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px;cursor:pointer;list-style:none}#session-toggle::-webkit-details-marker{display:none}#session-title{overflow-wrap:anywhere;min-width:0;font-weight:600}
.picker-body{padding:0 10px 10px;border-top:1px solid var(--line)}.picker-body label{display:block;margin:9px 0 4px;font-size:12px}#session-search{width:100%;min-width:0;padding:9px;border:1px solid var(--line);border-radius:7px;font:inherit;background:light-dark(#f7f8fa,#111315);color:light-dark(#202328,#f0f2f5)}
#session-options{max-height:300px;overflow-y:auto;overscroll-behavior:contain;padding:3px}.session-option{display:block;width:100%;text-align:left;margin:4px 0;padding:10px;background:light-dark(#fff,#1d1f22);color:light-dark(#202328,#f0f2f5)}.session-option:hover{background:light-dark(#eef5f2,#283a34)}.session-option[aria-pressed=true]{border-color:var(--accent);background:light-dark(#e6f3ec,#233e33)}.option-title,.option-detail{display:block;overflow-wrap:anywhere}.option-title{font-weight:600}.option-detail{font-size:11px;margin-top:3px;color:light-dark(#62666c,#b3b8bf)}
#session-toggle:focus-visible,#session-search:focus-visible{outline:2px solid var(--accent);outline-offset:2px}#title-hint,#context-explanation,.identifiers{font-size:12px}.identifiers summary{cursor:pointer;color:var(--muted)}#context-explanation{margin-top:9px}
</style></head><body>
<header><h1>Context Meter</h1><small>本地只读 · <span id="version"></span></small></header>
<p id="status" role="status">正在连接宿主…</p>
<p id="session-label">选择要监控的会话</p>
<details id="session-picker"><summary id="session-toggle" aria-labelledby="session-label session-title"><span id="session-title">请选择会话</span><span aria-hidden="true">⌄</span></summary>
<div class="picker-body"><label for="session-search">搜索标题或会话标识</label><input id="session-search" type="search" autocomplete="off" placeholder="输入会话名称、关键词或短码">
<p id="session-count" class="muted" role="status"></p><div id="session-options" role="group" aria-label="可选会话记录"></div></div></details>
<p id="title-hint" class="muted"></p>
<p class="session" id="selected">尚未选择会话记录</p>
<details class="identifiers"><summary>查看完整会话标识</summary><p id="identifiers" class="session">尚未选择</p></details>
<div class="toolbar"><button id="reload" type="button">刷新会话列表</button><button id="pause" type="button" aria-pressed="false">暂停刷新</button></div>
<p id="error" role="alert"></p>
<section class="cards" aria-label="主要指标"><div class="card"><span>窗口占用 · 估算</span><strong id="context-value">—</strong></div><div class="card"><span>最近缓存命中率</span><strong id="last-cache">—</strong></div><div class="card"><span>累计缓存命中率</span><strong id="total-cache">—</strong></div></section>
<progress id="context" max="1" value="0" aria-label="上下文占用估算"></progress>
<p id="context-explanation" class="muted">窗口占用根据最近请求估算；多次请求累计消耗可以超过窗口容量。</p>
<h2>Token 用量</h2><table><thead><tr><th scope="col">指标</th><th scope="col">最近一次请求</th><th scope="col">多次请求累计</th></tr></thead><tbody id="metrics"></tbody></table>
<p id="detail"></p><footer><p id="updated">尚无统计</p><p>每 2 秒读取最近上报值。缓存输入仍占窗口；推理输出已包含在输出中。窗口占用为估算，累计消耗不是当前窗口大小。</p><p>首次读取会分批扫描历史；面板隐藏或关闭时停止轮询。统计保存在内存中，不上传日志。</p></footer>
<script type="module">/* CONTEXT_METER_APP */</script></body></html>
